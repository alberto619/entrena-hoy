<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>ENTRENA HOY Audio Bridge</title>
<style>html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}</style>
</head>
<body>
<audio id="start" preload="auto" src="./start.mp3"></audio>
<audio id="tick" preload="auto" src="./tick.mp3"></audio>
<audio id="tickMedium" preload="auto" src="./tick_medium.mp3"></audio>
<audio id="tickFinal" preload="auto" src="./tick_final.mp3"></audio>
<audio id="finish" preload="auto" src="./finish.mp3"></audio>
<audio id="rest" preload="auto" src="./rest.mp3"></audio>

<script>
"use strict";

const sounds = {
  start: document.getElementById("start"),
  tick: document.getElementById("tick"),
  tickMedium: document.getElementById("tickMedium"),
  tickFinal: document.getElementById("tickFinal"),
  finish: document.getElementById("finish"),
  rest: document.getElementById("rest")
};

async function playSound(name){
  const audio = sounds[name];
  if(!audio) return;
  try{
    audio.pause();
    audio.currentTime = 0;
    await audio.play();
  }catch(err){
    console.error("Audio bridge:", name, err);
  }
}

window.addEventListener("message", (event) => {
  if(!event.data) return;

  if(event.data.type === "playStart"){
    playSound("start");
    return;
  }

  if(event.data.type === "playSound"){
    playSound(event.data.sound);
  }
});

// Tell parent that the bridge is definitely ready.
window.parent.postMessage({type:"audioReady"},"*");
</script>
</body>
</html>
